name: Build and Release TokenOrb

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build EXE, MSI, and release archives
        shell: powershell
        run: .\build.ps1 -OutputDirectory .\dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-Windows
          path: |
            dist/TokenOrb-Windows.exe
            dist/TokenOrb-Windows.msi
            dist/TokenOrb-Windows-source.zip
            dist/TokenOrb-Windows.sha256
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run macOS core checks
        run: swift run --package-path macos TokenOrbCoreChecks

      - name: Build macOS app
        run: bash macos/build_macos.sh

      - name: Verify macOS app
        run: |
          test "$(lipo -archs 'macos/dist/TokenOrb.app/Contents/MacOS/TokenOrb')" = "x86_64 arm64" || \
            test "$(lipo -archs 'macos/dist/TokenOrb.app/Contents/MacOS/TokenOrb')" = "arm64 x86_64"
          test "$(lipo -archs 'macos/dist/TokenOrb.app/Contents/Library/LoginItems/TokenOrbWatcher.app/Contents/MacOS/TokenOrbWatcher')" = "x86_64 arm64" || \
            test "$(lipo -archs 'macos/dist/TokenOrb.app/Contents/Library/LoginItems/TokenOrbWatcher.app/Contents/MacOS/TokenOrbWatcher')" = "arm64 x86_64"
          test "$(plutil -extract CFBundleDisplayName raw -o - macos/dist/TokenOrb.app/Contents/Info.plist)" = "TokenOrb"
          test "$(plutil -extract CFBundleDisplayName raw -o - macos/dist/TokenOrb.app/Contents/Library/LoginItems/TokenOrbWatcher.app/Contents/Info.plist)" = "TokenOrb"
          codesign --verify --deep --strict "macos/dist/TokenOrb.app"
          hdiutil verify macos/dist/TokenOrb-macOS.dmg
          unzip -t macos/dist/TokenOrb-macOS-source.zip
          mount_dir="$RUNNER_TEMP/token-orb-dmg"
          mkdir -p "$mount_dir"
          hdiutil attach macos/dist/TokenOrb-macOS.dmg -readonly -nobrowse -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          test -d "$mount_dir/TokenOrb.app"
          codesign --verify --deep --strict "$mount_dir/TokenOrb.app"
          test "$(lipo -archs "$mount_dir/TokenOrb.app/Contents/MacOS/TokenOrb")" = "x86_64 arm64" || \
            test "$(lipo -archs "$mount_dir/TokenOrb.app/Contents/MacOS/TokenOrb")" = "arm64 x86_64"
          test "$(lipo -archs "$mount_dir/TokenOrb.app/Contents/Library/LoginItems/TokenOrbWatcher.app/Contents/MacOS/TokenOrbWatcher")" = "x86_64 arm64" || \
            test "$(lipo -archs "$mount_dir/TokenOrb.app/Contents/Library/LoginItems/TokenOrbWatcher.app/Contents/MacOS/TokenOrbWatcher")" = "arm64 x86_64"
          hdiutil detach "$mount_dir"
          trap - EXIT
          cd macos/dist
          shasum -a 256 -c TokenOrb-macOS.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-macOS
          path: |
            macos/dist/TokenOrb-macOS.dmg
            macos/dist/TokenOrb-macOS-source.zip
            macos/dist/TokenOrb-macOS.sha256
          if-no-files-found: error

  build-linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils dpkg-dev python3-pyqt5

      - name: Build Debian package
        run: bash linux/packaging/build_deb.sh dist

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-Linux-deb
          path: dist/TokenOrb-Linux-x86_64.deb
          if-no-files-found: error

  build-linux-rpm:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build RPM in Fedora
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            fedora:latest \
            bash -euxo pipefail -c '
              dnf -y install desktop-file-utils findutils gzip rpm-build tar
              bash linux/packaging/build_rpm.sh dist
              rpm -qlp dist/TokenOrb-Linux-x86_64.rpm
            '
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-Linux-rpm
          path: dist/TokenOrb-Linux-x86_64.rpm
          if-no-files-found: error

  build-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils python3-pyqt5 python3-venv wget xvfb
          python3 -m venv --system-site-packages "$RUNNER_TEMP/tokenorb-venv"
          "$RUNNER_TEMP/tokenorb-venv/bin/pip" install --quiet pyinstaller
          wget -q -O "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"

      - name: Build AppImage
        env:
          PYINSTALLER: ${{ runner.temp }}/tokenorb-venv/bin/pyinstaller
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
        run: |
          bash linux/packaging/build_appimage.sh dist
          dist/TokenOrb-Linux-x86_64.AppImage --help
          set +e
          xvfb-run -a timeout --signal=TERM 8s dist/TokenOrb-Linux-x86_64.AppImage --demo
          status=$?
          set -e
          test "$status" = 124 || test "$status" = 143

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: TokenOrb-Linux-AppImage
          path: dist/TokenOrb-Linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos
      - build-linux-deb
      - build-linux-rpm
      - build-linux-appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7

      - name: Download verified build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: TokenOrb-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        working-directory: release-assets
        run: |
          sha256sum -c TokenOrb-Windows.sha256
          sha256sum -c TokenOrb-macOS.sha256
          sha256sum \
            TokenOrb-Linux-x86_64.deb \
            TokenOrb-Linux-x86_64.rpm \
            TokenOrb-Linux-x86_64.AppImage \
            > TokenOrb-Linux-x86_64.sha256
          sha256sum -c TokenOrb-Linux-x86_64.sha256

      - name: Enforce release asset allowlist
        working-directory: release-assets
        run: |
          assets=(
            TokenOrb-Windows.exe
            TokenOrb-Windows.msi
            TokenOrb-macOS.dmg
            TokenOrb-Windows-source.zip
            TokenOrb-macOS-source.zip
            TokenOrb-Windows.sha256
            TokenOrb-macOS.sha256
            TokenOrb-Linux-x86_64.deb
            TokenOrb-Linux-x86_64.rpm
            TokenOrb-Linux-x86_64.AppImage
            TokenOrb-Linux-x86_64.sha256
          )
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "${#assets[@]}"
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

      - name: Remove existing GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/TokenOrb-Windows.exe" \
            "release-assets/TokenOrb-Windows.msi" \
            "release-assets/TokenOrb-macOS.dmg" \
            "release-assets/TokenOrb-Windows-source.zip" \
            "release-assets/TokenOrb-macOS-source.zip" \
            "release-assets/TokenOrb-Windows.sha256" \
            "release-assets/TokenOrb-macOS.sha256" \
            "release-assets/TokenOrb-Linux-x86_64.deb" \
            "release-assets/TokenOrb-Linux-x86_64.rpm" \
            "release-assets/TokenOrb-Linux-x86_64.AppImage" \
            "release-assets/TokenOrb-Linux-x86_64.sha256" \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "TokenOrb $GITHUB_REF_NAME"
